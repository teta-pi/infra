# tetapi.dev — promo landing (static files)
# Deploys to /etc/nginx/sites-available/teta-pi (symlinked in sites-enabled as `teta-pi`).
# NOTE: the deployed file/symlink is named `teta-pi`, not `tetapi.dev` — see docs/deployment.md.
server {
    listen 80;
    server_name tetapi.dev www.tetapi.dev;

    root /var/www/teta-pi;
    index index.html;

    server_tokens off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}

server {
    listen 127.0.0.1:8081;
    server_name _;

    root /var/www/teta-pi;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
