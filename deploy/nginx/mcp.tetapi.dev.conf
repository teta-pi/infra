# mcp.tetapi.dev — MCP server (SSE streaming)
# Deploys to /etc/nginx/sites-available/mcp.tetapi.dev (symlinked in sites-enabled).
server {
    listen 80;
    server_name mcp.tetapi.dev;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

# Origin TLS (S-25, 5.16) — see app.tetapi.dev.conf for the full rationale.
# :80 above stays as-is (no redirect, CF still Flexible).
server {
    listen 443 ssl http2;
    server_name mcp.tetapi.dev;

    ssl_certificate /etc/ssl/certs/tetapi.dev.origin.pem;
    ssl_certificate_key /etc/ssl/private/tetapi.dev.origin.key;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
