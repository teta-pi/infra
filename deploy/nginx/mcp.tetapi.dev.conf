# mcp.tetapi.dev — MCP server (SSE streaming)
# Deploys to /etc/nginx/sites-available/mcp.tetapi.dev (symlinked in sites-enabled).
server {
    listen 80;
    server_name mcp.tetapi.dev;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
