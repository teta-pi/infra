# app.tetapi.dev — Next.js web app
# Deploys to /etc/nginx/sites-available/app.tetapi.dev (symlinked in sites-enabled).
server {
    listen 80;
    server_name app.tetapi.dev;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Origin TLS (S-25, 5.16) — CF still Flexible, so :80 above stays as-is (no
# redirect). This :443 block only stops the CF->origin hop (once CF flips to
# Full) and any unknown SNI falling through to the hellfire vhost. Cert covers
# *.tetapi.dev (see docs/deployment.md "Origin CA cert"). nginx 1.24.0 on this
# box predates the standalone `http2` directive (1.25.1+) — old `listen ...
# http2` form used instead.
server {
    listen 443 ssl http2;
    server_name app.tetapi.dev;

    ssl_certificate /etc/ssl/certs/tetapi.dev.origin.pem;
    ssl_certificate_key /etc/ssl/private/tetapi.dev.origin.key;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
