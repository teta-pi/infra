# Origin TLS (S-25, 5.16) — catch-all for unrecognized SNI on :443.
# Deploys to /etc/nginx/sites-available/default-tls-reject (symlinked in sites-enabled).
#
# Before this, the box had exactly one `listen 443 ssl` server block (the
# hellfire co-tenant's own Certbot vhost, server_name hellfiresol.com
# www.hellfiresol.com) with no default_server flag — nginx picks the first
# (here: only) matching listen as the implicit default, so ANY unrecognized
# SNI — including every one of our own hostnames before their own :443 blocks
# existed — silently got hellfire's cert and content. See docs/security.md
# S-25 and scripts/security/probe.py::check_origin_tls_identity.
#
# This block is additive: it declares itself the explicit default_server for
# :443, which nginx accepts even though hellfiresol.com's block has no
# default_server of its own (only one default_server is allowed per
# addr:port, and none was explicitly claimed before). hellfiresol.com's own
# vhost file is NOT ours to edit and is left untouched — it keeps matching
# its own SNI (hellfiresol.com / www.hellfiresol.com) correctly; only the
# *fallback* for everything else changes.
#
# ssl_reject_handshake hard-fails the TLS handshake for any SNI that doesn't
# match one of our explicit server_name blocks (confirmed nginx 1.24.0 on
# this box supports it — added in 1.19.4). No ssl_certificate/key needed:
# the rejection happens at ClientHello, before a cert would be selected.
#
# `http2` on the listen line matches every other :443 block on this socket —
# nginx treats http2/ssl/etc as per-socket, not truly per-server, on 1.24.0
# (pre-1.25.1 listen syntax); a mismatched flag here just produces a harmless
# "protocol options redefined" warning on `nginx -t`, kept identical to avoid it.
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
