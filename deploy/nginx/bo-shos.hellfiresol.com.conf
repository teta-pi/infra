# shos (SH.OS) staff back-office vhost — OWNED BY TETA+PI, not by SH.OS.
# Second vhost for the same co-tenant (the first is shos.hellfiresol.com → :8200).
# SH.OS never edits nginx: they tell us which loopback port (in their 8200–8299
# range) the app listens on, we point a vhost at it. See docs/deployment.md
# "Co-tenant: shos (SH.OS)".
#
# Domain: bo-shos.hellfiresol.com → http://127.0.0.1:8202 (SH.OS staff back-office).
# Requested by SH.OS S1 DevOps 2026-09-26, approved by the manager session.
# Pre-checked before deploy: 8202 listens on 127.0.0.1 only (alongside 8200/8201),
# inside the allotted 8200–8299 range, served by rootless docker under `shos`.
#
# RENAMED 2026-10-05 (5.17) from `bo.shos.hellfiresol.com`: Cloudflare's free
# Universal SSL only covers one subdomain level (`*.hellfiresol.com`), so a
# two-label name (`bo.shos.`) could never get a valid edge cert — the owner
# fixed this at the DNS level by switching to a single-label name
# (`bo-shos.`). Old DNS record removed, new one resolves; this vhost and the
# origin cert SAN follow suit (see docs/deployment.md "Origin TLS").
#
# ⚠ NO :80 → https redirect here (deliberate, same as every other host on this box).
# This zone terminates TLS at Cloudflare and CF reaches the origin over :80
# (confirmed: shos.hellfiresol.com already serves SH.OS's app through that path), so
# an origin-side redirect would loop. HTTPS enforcement belongs to Cloudflare
# ("Always Use HTTPS") — an owner action, see docs/deployment.md.
#
# 🔒 BASIC AUTH is part of this vhost by SH.OS's own request: the back-office must not
# be publicly reachable without a gate while Cloudflare Access is not yet in front of
# it. The password file is generated ON THE SERVER and never committed:
#   /etc/nginx/.htpasswd-shos-bo, root:www-data, 640, user `shos-bo`.
# Do NOT remove the gate unilaterally — only on a separate SH.OS request once CF
# Access is live (docs/deployment.md).
#
# Deploys to /etc/nginx/sites-available/bo-shos.hellfiresol.com, symlinked into
# sites-enabled, then `nginx -t` && `systemctl reload nginx` (reload, never restart).
server {
    listen 80;
    server_name bo-shos.hellfiresol.com;

    include snippets/security-headers.conf;

    # Gate applies to the whole host. The single location below sets no auth_basic
    # of its own, so it inherits this (the same inheritance trap 5.6 hit with
    # add_header: a directive re-declared in a location replaces the inherited set —
    # so do not add auth_basic/add_header inside location{} here).
    auth_basic "SHOSHO back-office (staging)";
    auth_basic_user_file /etc/nginx/.htpasswd-shos-bo;

    location / {
        proxy_pass http://127.0.0.1:8202;   # ← SH.OS-supplied port, must be 8200–8299
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# Origin TLS (S-25, 5.16) — see docs/deployment.md "Origin TLS". :80 above
# stays as-is (no redirect, CF still Flexible). Same shos.hellfiresol.com
# origin cert as the sibling vhost (SAN covers both). auth_basic re-declared
# here on purpose — it does NOT inherit across server{} blocks (only within
# one, and even then not into a location{} that redeclares other directives —
# the 5.6/5.16 inheritance trap), so the :443 block needs its own gate or the
# back-office would be reachable ungated once this block is live.
server {
    listen 443 ssl http2;
    server_name bo-shos.hellfiresol.com;

    ssl_certificate /etc/ssl/certs/shos.hellfiresol.com.origin.pem;
    ssl_certificate_key /etc/ssl/private/shos.hellfiresol.com.origin.key;

    include snippets/security-headers.conf;

    auth_basic "SHOSHO back-office (staging)";
    auth_basic_user_file /etc/nginx/.htpasswd-shos-bo;

    location / {
        proxy_pass http://127.0.0.1:8202;   # ← SH.OS-supplied port, must be 8200–8299
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
