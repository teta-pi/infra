# :80 catch-all for unrecognized Host — S-26, 5.17. Sibling of
# default-tls-reject.conf (same gap, one port later): that file closed the
# :443 version of this hole (unknown SNI silently got hellfire's cert); this
# one closes the :80 version (unknown Host silently got OUR content).
#
# Found during the bo.shos→bo-shos rename (5.17) while re-checking routing:
# `curl -H "Host: totally-unknown-name.example" http://164.90.235.66/` → 200,
# body = api.tetapi.dev. No :80 server block on the box declared itself
# default_server, so nginx fell back to the first one by config-load order
# (alphabetical sites-enabled glob → api.tetapi.dev), and served it for ANY
# Host header. Anyone pointing their own domain's A/CNAME at this droplet's
# IP got our API's response under their own hostname — not a data leak (no
# per-host secret varies the body) but real impersonation/domain-fronting
# surface and noise in anyone else's logs who tries it.
#
# This block is additive, same pattern as default-tls-reject.conf: declares
# itself default_server for :80, which nginx accepts even though no other
# :80 block claimed it. hellfire's own vhost (not ours to edit) keeps its
# explicit server_name match (hellfiresol.com / www.hellfiresol.com) and is
# completely unaffected — only the *fallback* for everything else changes.
#
# 444 (nginx-specific: close the connection, send nothing) chosen over 421
# Misdirected Request to match the spirit of :443's ssl_reject_handshake —
# minimum information disclosure, not even a status line, to a Host that
# was never ours to answer for.
#
# ACME checked before adding this (hellfire's Certbot renews via the box's
# own :80, and we must not break someone else's prod): authenticator is the
# certbot `nginx` plugin (`/etc/letsencrypt/renewal/hellfiresol.com.conf`),
# which validates HTTP-01 by temporarily patching *their own* server block
# (server_name hellfiresol.com www.hellfiresol.com) — the challenge request
# always carries one of those Host headers, so it matches their explicit
# vhost directly and never reaches this default_server. No
# /.well-known/acme-challenge/ carve-out needed here. (certbot.timer runs
# twice daily but no-ops until within 30 days of expiry; next real renewal
# ~2026-11-17, cert valid to 2026-12-17 — confirmed via `certbot
# certificates` before this change, not guessed.)
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
