# shos (SH.OS) co-tenant vhost — OWNED BY TETA+PI, not by SH.OS.
# SH.OS never edits nginx: they tell us which loopback port (in their 8200–8299
# range) their app listens on, we point a vhost at it. See docs/deployment.md
# "Co-tenant: shos (SH.OS)".
#
# Domain: shos.hellfiresol.com (SH.OS is a product of the hellfire company; a
# SUBDOMAIN so the live apex hellfiresol.com / :8090 hellfire site is untouched).
#
# ✅ DEPLOYED 2026-09-20 (5.10) — SH.OS access ENABLED. Preconditions met:
#   1. DNS `shos.hellfiresol.com` → Cloudflare (proxied): 104.21.25.237 /
#      172.67.168.47 (verified 2026-09-20).
#   2. TLS = Cloudflare: origin stays `listen 80` + CF TLS, like the tetapi hosts;
#      NO Certbot needed. (The apex hellfiresol.com is grey-clouded/direct with its
#      own Certbot cert — different setup, untouched.) ⚠ enable-time check: this
#      zone's CF SSL mode must let CF reach the :80 origin (Flexible). If the shos
#      subdomain returns 525/526, the zone is Full/strict → add a 443 origin cert
#      for this host or align the SSL mode.
#   3. Isolation blockers S-18/S-19/S-20 (docs/security.md §5) CLOSED in 5.9.
# Until SH.OS's app listens on 8200, this vhost returns 502 — expected.
#
# Cloudflare-proxied path (origin listen 80 only, same as every other host —
# see docs/deployment.md "Security response headers").
# Deploys to /etc/nginx/sites-available/shos.hellfiresol.com, symlinked into
# sites-enabled, then `nginx -t` && `systemctl reload nginx` (reload, never restart).
server {
    listen 80;
    server_name shos.hellfiresol.com;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8200;   # ← SH.OS-supplied port, must be 8200–8299
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
