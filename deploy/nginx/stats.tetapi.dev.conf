# stats.tetapi.dev — GoatCounter
# Deploys to /etc/nginx/sites-available/stats.tetapi.dev (symlinked in sites-enabled).
# Newly tracked here as of 5.16 — previously server-only (out of the 5.6 header
# rollout, see docs/deployment.md); brought into the repo now because the S-25
# origin-TLS fix touches every host's vhost and leaving this one untracked would
# just reintroduce the drift problem docs/deployment.md already warns about.
# :80 content mirrors the server's pre-5.16 config exactly (no
# snippets/security-headers.conf here — matches its existing exception).
server {
    listen 80;
    server_name stats.tetapi.dev;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Origin TLS (S-25, 5.16) — see docs/deployment.md "Origin TLS". :80 above
# stays as-is (no redirect, CF still Flexible). Cert covers *.tetapi.dev.
server {
    listen 443 ssl http2;
    server_name stats.tetapi.dev;

    ssl_certificate /etc/ssl/certs/tetapi.dev.origin.pem;
    ssl_certificate_key /etc/ssl/private/tetapi.dev.origin.key;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
