# shos (SH.OS) co-tenant vhost — OWNED BY TETA+PI, not by SH.OS.
# SH.OS never edits nginx: they tell us which loopback port (in their 8200–8299
# range) their app listens on, we point a vhost at it. See docs/deployment.md
# "Co-tenant: shos (SH.OS)".
#
# Domain: shos.hellfiresol.com (SH.OS is a product of the hellfire company; a
# SUBDOMAIN so the live apex hellfiresol.com / :8090 hellfire site is untouched).
#
# ⚠ NOT deployable yet:
#   1. Owner adds DNS A `shos.hellfiresol.com` → 164.90.235.66.
#   2. TLS: decide at enable-time by how the DNS is set — if shos.hellfiresol.com
#      is Cloudflare-proxied (orange cloud), origin stays `listen 80` + CF TLS,
#      like the tetapi hosts (this file). If hellfiresol.com is NOT on Cloudflare
#      (the apex uses its own Certbot cert), issue a Certbot cert for this
#      subdomain instead and add the 443 server block — mirror the apex vhost.
#   3. Do NOT copy this to the server until the pre-existing isolation blockers
#      in docs/security.md (S-18 world-readable .env, S-19 /opt/tetapi/api owned
#      by co-tenant, S-20 redis no-auth) are fixed — a live shos vhost is one of
#      the last steps of granting SH.OS access, which stays OFF until then.
#
# As written this assumes the Cloudflare-proxied path (origin listen 80 only,
# same as every other host — see docs/deployment.md "Security response headers").
# Deploys to /etc/nginx/sites-available/shos, symlinked into sites-enabled, then
# `nginx -t` && `systemctl reload nginx` (reload, never restart).
server {
    listen 80;
    server_name shos.hellfiresol.com;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8200;   # ← SH.OS-supplied port, must be 8200–8299
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
