# shos (SH.OS) co-tenant vhost — OWNED BY TETA+PI, not by SH.OS.
# SH.OS never edits nginx: they tell us which loopback port (in their 8200–8299
# range) their app listens on, we point a vhost at it. See docs/deployment.md
# "Co-tenant: shos (SH.OS)".
#
# ⚠ PLACEHOLDER — not deployable yet. Two things are still open (2026-09-18):
#   1. server_name below is a placeholder — owner must supply the real SH.OS
#      domain and confirm its DNS (Cloudflare?) points at 164.90.235.66.
#   2. Do NOT copy this to the server until the pre-existing isolation blockers
#      in docs/security.md (S-18 world-readable .env, S-19 /opt/tetapi/api owned
#      by co-tenant, S-20 redis no-auth) are fixed — a live shos vhost is one of
#      the last steps of granting SH.OS access, which stays OFF until then.
#
# TLS terminates at Cloudflare (origin is listen 80 only, same as every other
# host — see docs/deployment.md "Security response headers"). Deploys to
# /etc/nginx/sites-available/shos and is symlinked into sites-enabled, then
# `nginx -t` && `systemctl reload nginx` (reload, never restart).
server {
    listen 80;
    server_name shos.PLACEHOLDER.tld;   # ← owner to set real SH.OS domain

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8200;   # ← SH.OS-supplied port, must be 8200–8299
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
