# Shared security headers for the proxied subdomains (app / api / mcp).
# Deploys to /etc/nginx/snippets/security-headers.conf and is pulled in with
#   include snippets/security-headers.conf;
# inside each server{} (nginx resolves the relative path against /etc/nginx/).
#
# `always` so the headers are emitted on 4xx/5xx too (api answers 405 and mcp
# 404 to GET /, which is exactly what the 15.6 probe requests).
#
# NOTE: the landing (tetapi.dev / sites-available `teta-pi`) does NOT include
# this snippet. It already carries its own richer, self-contained header set and
# keeps X-Frame-Options: SAMEORIGIN (it may frame its own pages), so it only
# adds the one header it was missing — HSTS — inline. Including this DENY snippet
# there would emit a second, conflicting X-Frame-Options and duplicate nosniff /
# Referrer-Policy.
#
# HSTS: starts at max-age=86400 (1 day), no includeSubDomains, no preload.
# Raise plan in docs/deployment.md. Applies to the browser<->Cloudflare hop
# regardless of the Cloudflare SSL mode (residual noted in docs/security.md §6.3).
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
