# api.tetapi.dev — FastAPI
# Deploys to /etc/nginx/sites-available/api.tetapi.dev (symlinked in sites-enabled).
server {
    listen 80;
    server_name api.tetapi.dev;
    client_max_body_size 50M;

    include snippets/security-headers.conf;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Origin TLS (S-25, 5.16) — see app.tetapi.dev.conf for the full rationale.
# :80 above stays as-is (no redirect, CF still Flexible).
server {
    listen 443 ssl http2;
    server_name api.tetapi.dev;
    client_max_body_size 50M;

    ssl_certificate /etc/ssl/certs/tetapi.dev.origin.pem;
    ssl_certificate_key /etc/ssl/private/tetapi.dev.origin.key;

    include snippets/security-headers.conf;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
