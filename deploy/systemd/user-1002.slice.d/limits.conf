# Resource cap for the co-tenant `shos` (uid 1002) — see docs/deployment.md
# "Co-tenant: shos (SH.OS)". Applied MANUALLY (like the nginx confs), not by CI:
#   sudo mkdir -p /etc/systemd/system/user-1002.slice.d
#   sudo cp deploy/systemd/user-1002.slice.d/limits.conf \
#           /etc/systemd/system/user-1002.slice.d/limits.conf
#   sudo systemctl daemon-reload
#   systemctl show user-1002.slice -p MemoryMax -p MemorySwapMax \
#           -p CPUQuotaPerSecUSec -p TasksMax   # verify
#
# The whole shos footprint — its `systemd --user` services AND its rootless
# dockerd (which runs under user@1002.service → user-1002.slice) — is capped here.
# NOTE: this only binds processes under the shos *user manager*. A `sudo -u shos …`
# from another login runs under that login's slice, NOT here (so the live OOM
# stress test must be run from a real shos session, not via sudo).
#
# Chosen against the 2GB / 1-vCPU droplet shared with TETA+PI (root) + the
# hellfire co-tenant (see docs/security.md B6): at measurement `available` was
# ~1086 MB, so a 512 MB hard cap leaves TETA+PI its current usage with headroom.
# CPUQuota=50% (NOT 100%): there is only ONE vCPU for everyone; tetapi-api is
# RAM-bound (idle load <0.2). Half a core guarantees shos can never starve the
# API of more than 50% of the single core.
# MemorySwapMax=0 (added 5.10, 2026-09-20): the box has a 2 GB swapfile and the
# slice defaulted to `memory.swap.max=max`, so MemoryMax was only a RAM-residency
# limit — a shos process could exceed 512 MB by spilling to swap (verified: a 650 MB
# allocation survived; memory.events high=742 / oom_kill=0, pages went to swap).
# That let a runaway shos consume ~1.9 GB of shared swap and thrash disk I/O,
# degrading TETA+PI even though its RAM cap held. Pinning swap to 0 makes 512 MB a
# TRUE hard ceiling. Confined to the shos slice; cannot affect TETA+PI (which runs
# outside user-1002.slice).
#
# MemoryHigh REMOVED (5.10, 2026-09-20): the original 410M throttle was meant as
# "throttle-before-kill", which only makes sense WITH swap. With MemorySwapMax=0 it
# has no reclaim target, so a runaway livelocks in throttle between High and Max
# (observed: memory.events high climbed to 23443, process wedged at ~451M, never
# OOM-killed, and the throttle stalled other shos sessions too). Dropping High lets
# MemoryMax=512M do a clean, prompt OOM-kill — the intended "kernel kills a shos
# process first" behaviour. TETA+PI stayed healthy (api/app 200) throughout both
# the wedged and the clean-kill states.
[Slice]
MemoryMax=512M
MemorySwapMax=0
CPUQuota=50%
TasksMax=512
